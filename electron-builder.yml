appId: com.stefano.backupmanager
productName: Backup Manager
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!.superpowers/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,mts}'
  - '!components.json'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Tray icons are loaded from process.resourcesPath when packaged.
extraResources:
  - from: resources
    to: .
    filter:
      - tray*.png
win:
  executableName: backup-manager
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Icon Composer file: on macOS 26+ the Dock draws it with liquid glass; build/icon.icns stays the
  # fallback for older macOS. Compiling it needs Xcode 26's actool (see build:mac).
  icon: build/icon.icon
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.utilities
  target:
    - dmg
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Stefano
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
